<style>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString("en-US");
const fmtP = (p) => p === null || p === undefined ? "n/a" : p < 1e-16 ? "< 1e-16" : p.toExponential(1);
const pct = (x, d = 1) => (100 * x).toFixed(d) + "%";

// ------------------------------------------------------------------ colours
const STAGE_COL = { "6": "#009E73", "24": "#CC79A7", "36": "#E69F00", "48": "#0072B2" };

const CPLX_COL = { low: "#d9a441", medium: "#8b3a1e", high: "#4c5c94", NA: "#bdbdbd" };

const GREY = [218, 214, 206];
function ramp(stops) { const S = stops.map(hex); return (t) => { t = Math.max(0, Math.min(1, t)); const x = t * (S.length - 1), k = Math.min(Math.floor(x), S.length - 2), f = x - k; return [0, 1, 2].map((c) => Math.round(S[k][c] * (1 - f) + S[k + 1][c] * f)); }; }
const GENE_RAMP = ramp(["#dcdcdc", "#a99be8", "#5a3ff0", "#1a00c8"]);
const PLASMA = ramp(["#0d0887", "#6a00a8", "#b12a90", "#e16462", "#fca636", "#f0f921"]);
const VIR = ramp(["#440154", "#3b528b", "#21918c", "#5ec962", "#fde725"]);
const PLY_PLASMA = [[0, "#0d0887"], [0.2, "#6a00a8"], [0.4, "#b12a90"], [0.6, "#e16462"], [0.8, "#fca636"], [1, "#f0f921"]];
const PLY_VIR = [[0, "#440154"], [0.25, "#3b528b"], [0.5, "#21918c"], [0.75, "#5ec962"], [1, "#fde725"]];
const PLY_BLUE = [[0, "#dcdcdc"], [0.35, "#a99be8"], [0.7, "#5a3ff0"], [1, "#1a00c8"]];
const cssOf = (c) => typeof c === "string" ? c : `rgb(${c.join(",")})`;

// ------------------------------------------------------------------ data access
async function fetchBin(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + " → HTTP " + r.status);
  const b = new Uint8Array(await r.arrayBuffer());
  if (b[0] === 0x1f && b[1] === 0x8b) return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return b.buffer;
}
const jsonCache = new Map();
function getJSON(url) { if (!jsonCache.has(url)) jsonCache.set(url, fetch(url).then((r) => { if (!r.ok) throw new Error(url + " → " + r.status); return r.json(); })); return jsonCache.get(url); }
let EM, N, C = {};
async function boot() {
  EM = await getJSON(D + "manifest.json"); N = EM.n_cells;
  const buf = await fetchBin(D + "cells.bin.gz");
  const TA = { float32: Float32Array, uint16: Uint16Array, uint8: Uint8Array };
  for (const [k, L] of Object.entries(EM.layout)) C[k] = new TA[L.dtype](buf, L.offset, L.length);
}
const code = (k) => C["code:" + k];
const catOf = (k, i) => EM.annotations[k][code(k)[i]];
const geneCache = new Map();
function gene(g) {
  if (!geneCache.has(g)) {
    const k = EM.genes_percell.indexOf(g);
    if (k < 0) return Promise.reject(new Error(`no per-cell values for ${g}`));
    geneCache.set(g, fetchBin(`${D}genes/${k}.bin.gz`).then((b) => { const q = new Uint8Array(b), mx = EM.gene_max[g], v = new Float32Array(N); for (let i = 0; i < N; i++) v[i] = q[i] / 255 * mx; return v; }));
  }
  return geneCache.get(g);
}
const embCache = new Map();
async function emb(name) {
  if (!embCache.has(name)) embCache.set(name, (async () => {
    const E = (await getJSON(P + "embeddings.json"))[name];
    const b = await fetchBin(P + E.file), n = E.n, idx = new Uint32Array(b, 0, n), q = new Uint16Array(b, 4 * n, 2 * n), xy = new Float32Array(2 * n);
    for (let i = 0; i < n; i++) { xy[2*i] = E.lo[0] + q[2*i] / 65535 * (E.hi[0] - E.lo[0]); xy[2*i+1] = E.lo[1] + q[2*i+1] / 65535 * (E.hi[1] - E.lo[1]); }
    return { idx, xy, n };
  })());

}
function globalEmb(name) {   // all cells on an authors' UMAP
  const src = C["emb:" + name], idx = new Uint32Array(N); for (let i = 0; i < N; i++) idx[i] = i;
  return { idx, xy: src, n: N };
}
function subsetEmb(E, keep) {  // keep(i_explorer) -> bool
  const ii = [], xy = [];
  for (let k = 0; k < E.n; k++) { const i = E.idx[k]; if (keep(i)) { ii.push(i); xy.push(E.xy[2*k], E.xy[2*k+1]); } }
  return { idx: Uint32Array.from(ii), xy: Float32Array.from(xy), n: ii.length };
}

// ------------------------------------------------------------------ canvas scatter (pan / zoom)
class Scat {

    this.el = el; el.classList.add("scat"); if (opts.short) el.classList.add("short");
    this.cv = document.createElement("canvas"); el.appendChild(this.cv);
    const rz = document.createElement("span"); rz.className = "rz"; rz.textContent = "reset"; rz.onclick = () => this.fit(); el.appendChild(rz);
    this.size = opts.size || 1.6; this.labels = []; this.k = 1; this.tx = 0; this.ty = 0;
    let drag = null;
    el.addEventListener("wheel", (e) => { e.preventDefault(); const r = el.getBoundingClientRect(), f = Math.exp(-e.deltaY * 0.0015), mx = e.clientX - r.left, my = e.clientY - r.top; this.tx = mx - (mx - this.tx) * f; this.ty = my - (my - this.ty) * f; this.k *= f; this.draw(); }, { passive: false });
    el.addEventListener("pointerdown", (e) => { if (e.target === rz) return; drag = [e.clientX, e.clientY, this.tx, this.ty]; el.setPointerCapture(e.pointerId); el.style.cursor = "grabbing"; });
    el.addEventListener("pointermove", (e) => { if (!drag) return; this.tx = drag[2] + e.clientX - drag[0]; this.ty = drag[3] + e.clientY - drag[1]; this.draw(); });
    el.addEventListener("pointerup", () => { drag = null; el.style.cursor = ""; });
    el.addEventListener("dblclick", () => this.fit());

  }
  set(xy, rgba, order, labels) {   // xy Float32 (2n), rgba Uint8 (4n), order: Uint32 draw order
    this.xy = xy; this.rgba = rgba; this.n = xy.length / 2; this.order = order; this.labels = labels || [];
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = 0; i < this.n; i++) { const x = xy[2*i], y = xy[2*i+1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    this.b = [x0, x1, y0, y1]; this.fit();
  }
  fit() {
    const W = this.el.clientWidth, H = this.el.clientHeight; if (!W || !this.b) return;
    const [x0, x1, y0, y1] = this.b, s = 0.92 * Math.min(W / (x1 - x0 || 1), H / (y1 - y0 || 1));

  }

    if (!this.xy) return;
    const dpr = window.devicePixelRatio || 1, W = this.el.clientWidth, H = this.el.clientHeight;

    u32.fill(0xfff7fdff);   // #fffdf7 in ABGR

    const rgba = this.rgba, xy = this.xy, ord = this.order, n = ord ? ord.length : this.n;
    for (let q = 0; q < n; q++) {
      const i = ord ? ord[q] : q, a = rgba[4*i+3]; if (!a) continue;
      const px = Math.round((s * xy[2*i] + this.k * 0 + this.tx) * dpr) - h, py = Math.round((-s * xy[2*i+1] + this.ty) * dpr) - h;
      if (px < -ps || py < -ps || px >= cw || py >= ch) continue;
      const r = rgba[4*i], g = rgba[4*i+1], b = rgba[4*i+2];
      for (let dy = 0; dy < ps; dy++) { const yy = py + dy; if (yy < 0 || yy >= ch) continue; let o = yy * cw + px;
        for (let dx = 0; dx < ps; dx++, o++) { const xx = px + dx; if (xx < 0 || xx >= cw) continue;
          if (a === 255) u32[o] = 0xff000000 | (b << 16) | (g << 8) | r;
          else { const p = u32[o], f = a / 255; u32[o] = 0xff000000 | (Math.round(((p >> 16) & 255) * (1 - f) + b * f) << 16) | (Math.round(((p >> 8) & 255) * (1 - f) + g * f) << 8) | Math.round((p & 255) * (1 - f) + r * f); } } }

    }
  }
}
// build colour buffers
function catColors(E, catFn, colMap, alpha = 230, bgFn) {

    const i = E.idx[k], c = catFn(i);
    let col = colMap[c];
    if (col === undefined) { col = GREY; pri[k] = 0; } else pri[k] = 1;
    if (typeof col === "string") col = hex(col);
    rgba[4*k] = col[0]; rgba[4*k+1] = col[1]; rgba[4*k+2] = col[2]; rgba[4*k+3] = col === GREY ? 150 : alpha;

}
function valColors(E, val, rampFn, lo, hi, zeroGrey = true) {
  const n = E.n, rgba = new Uint8Array(4 * n), pri = new Float32Array(n);
  for (let k = 0; k < n; k++) {
    const v = val(E.idx[k]);
    let col, a = 235;
    if (v === null || Number.isNaN(v)) { col = GREY; a = 110; pri[k] = -1; }
    else if (zeroGrey && v <= 0) { col = GREY; a = 150; pri[k] = 0; }
    else { const t = (v - lo) / (hi - lo || 1); col = rampFn(t); pri[k] = t + 0.001; }

let seed = 11;

function q99(vals) { const a = vals.filter((v) => v > 0).sort((x, y) => x - y); return a.length ? a[Math.floor(a.length * 0.99)] || a[a.length - 1] : 1; }

// ------------------------------------------------------------------ page scaffolding
const BADGE = { auth: '<i class="dot d-auth" title="authors\' data"></i>', ours: '<i class="dot d-ours" title="recomputed here"></i>', paper: '<i class="dot d-paper" title="from the paper"></i>', na: "" };
const esc = (t) => t.replace(/<[^>]+>/g, "").replace(/"/g, "&quot;");
function card(parent, L, title, badges, desc, opts = {}) {
  const c = document.createElement("section"); c.className = "card" + (opts.wide ? " wide" : "") + (opts.na ? " na" : "");
  c.innerHTML = `<h3><span class="L">${L}</span> ${title} <span>${badges.map((b) => BADGE[b]).join("")}</span>${desc ? `<i class="info" title="${esc(desc)}">i</i>` : ""}</h3>`;
  parent.appendChild(c); return c;
}
function div(parent, cls, html) { const d = document.createElement("div"); if (cls) d.className = cls; if (html) d.innerHTML = html; parent.appendChild(d); return d; }
function scatCell(parent, caption, opts) { const cell = div(parent, "cell"); if (caption) div(cell, "cap", caption); const el = div(cell); const s = new Scat(el, opts); const leg = div(cell, "legend"); return { s, leg, cell }; }
function legendHTML(map, labels) { return Object.entries(map).map(([k, c]) => `<span><span class="sw" style="background:${cssOf(c)}"></span>${labels ? labels[k] || k : k}</span>`).join(""); }
function cbarHTML(title, lo, hi, css) { return `<div class="cbar">${title} <span>${lo}</span><i style="background:linear-gradient(90deg,${css})"></i><span>${hi}</span></div>`; }
const BLUE_CSS = "#dcdcdc,#a99be8,#5a3ff0,#1a00c8", PLASMA_CSS = "#0d0887,#6a00a8,#b12a90,#e16462,#fca636,#f0f921", VIR_CSS = "#440154,#3b528b,#21918c,#5ec962,#fde725";
const SKIP = new WeakMap();
function NA(parent, L, title, why) { const root = parent.parentElement; let el = SKIP.get(root); if (!el) { el = document.createElement("div"); el.className = "skipped"; el.dataset.items = ""; SKIP.set(root, el); root.appendChild(el); } const items = (el.dataset.items ? el.dataset.items.split("|") : []).concat(L); el.dataset.items = items.join("|"); el.innerHTML = `Not shown (connectome, imaging or brain data): ${items.join(", ")}`; el.title = ""; }
function lay(extra) { return Object.assign({ paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "#fffdf7", font: { family: "IBM Plex Sans, sans-serif", size: 11.5, color: "#1d1b16" }, margin: { l: 55, r: 15, t: 30, b: 45 }, hoverlabel: { bgcolor: "#fff" } }, extra || {}); }
const PC = { responsive: true, displaylogo: false, modeBarButtonsToRemove: ["lasso2d", "select2d"] };
function plot(parent, h) { const d = div(parent, "plot"); d.style.height = (h || 340) + "px"; return d; }

async function geneScatter(cell, E, g, opts = {}) {
  const v = await gene(g), hi = opts.hi || q99(Array.from(E.idx, (i) => v[i]));

}
function segLabels(E, h) {   // label centroid of each segment in a hemilineage embedding
  const acc = {};
  for (let k = 0; k < E.n; k++) { const s = catOf("soma_neuromere", E.idx[k]); if (!SEG_COL[s]) continue; (acc[s] = acc[s] || [0, 0, 0]); acc[s][0] += E.xy[2*k]; acc[s][1] += E.xy[2*k+1]; acc[s][2]++; }

}
function kde(vals, grid) { const n = vals.length; if (!n) return grid.map(() => 0); const m = vals.reduce((a, b) => a + b, 0) / n, sd = Math.sqrt(vals.reduce((a, b) => a + (b - m) ** 2, 0) / n) || 1, bw = 1.06 * sd * n ** -0.2; return grid.map((x) => vals.reduce((a, v) => a + Math.exp(-0.5 * ((x - v) / bw) ** 2), 0) / (n * bw * Math.sqrt(2 * Math.PI))); }

let PROF = null;
async function profiles() {

  const T = await getJSON(P + "trajectories.json"), b = new Uint8Array(await fetchBin(P + "profiles.bin.gz"));
  const nt = T.trajectories.length, ng = T.genes.length, nb = T.n_bins, sz = nt * ng * nb;
  const dec = (off) => (t, gname) => { const ti = T.trajectories.indexOf(t), gi = T.genes.indexOf(gname); if (ti < 0 || gi < 0) return null; const o = off + (ti * ng + gi) * nb; return Array.from(b.subarray(o, o + nb), (v) => v === 255 ? null : v / 254 * T.scale_max); };
  PROF = { T, raw: dec(0), sm: dec(sz), x: T.bin_centres };
  return PROF;
}

  { const c = scatCell(rj, "Sex", { size: 2.4 }); const { rgba, order } = catColors(E01s, (i) => d1.Sex[pos01.get(i)], { F: "#d6338a", M: "#2ab07f" }, 230); c.s.set(E01s.xy, rgba, order); c.leg.innerHTML = legendHTML({ Female: "#d6338a", Male: "#2ab07f" }); }
  { const c = scatCell(rj, "Correction score", { size: 2.4 }); const vals = d1.CorrectionDegree_1.filter((v) => v !== null), lo = Math.min(...vals), hi = Math.max(...vals); const { rgba, order } = valColors(E01s, vOf("CorrectionDegree_1"), GENE_RAMP, lo, hi, false); c.s.set(E01s.xy, rgba, order); c.leg.innerHTML = cbarHTML("molecular distance", lo.toFixed(1), hi.toFixed(1), BLUE_CSS); }
  // k
  const ck = card(g, "k", "Sex differences per cluster, 24 → 48 h", ["auth", "ours"], "Per cluster: mean correction score (top) and number of male–female DEGs (bottom) at 24 and 48 h APF, from the authors' metadata; lines join the same cluster. Blue: <i>fru</i><sup>+</sup> clusters (≥ 50% of cells <i>fru</i><sup>+</sup>), grey: <i>fru</i><sup>−</sup>. Green or blue lines: two-sided t-test 24 vs 48 h, Bonferroni-corrected p < 0.01 (our test on the authors' per-cell scores).");
  const trs = [...new Set(S.fig5k.map((r) => r.traj))].sort();
  const sk = div(ck, "ctl", `trajectory <select>${trs.map((t) => `<option${t === "01A-T1" ? " selected" : ""}>${t}</option>`).join("")}</select>`).querySelector("select");
  const pk1 = plot(ck, 230), pk2 = plot(ck, 230);
  const drawK = () => {
    const rows = S.fig5k.filter((r) => r.traj === sk.value && r.corr24 !== null && r.corr48 !== null);
    const tr1 = rows.map((r) => ({ type: "scatter", mode: "lines+markers", x: ["24", "48"], y: [r.corr24, r.corr48], marker: { color: r.fru_pos ? "#1f3fff" : "#bbb", size: 8 }, line: { color: r.p_bonf !== null && r.p_bonf < 0.01 ? (r.fru_pos ? "#1f3fff" : "#2ca02c") : "#ccc" }, name: `cluster ${r.cluster}`, hovertemplate: `cluster ${r.cluster} (n=${r.n})<br>%{y:.2f}<br>p_bonf ${r.p_bonf}<extra></extra>`, showlegend: false }));
    const tr2 = rows.filter((r) => r.deg24 !== null && r.deg48 !== null).map((r) => ({ type: "scatter", mode: "lines+markers", x: ["24", "48"], y: [r.deg24, r.deg48], marker: { color: r.fru_pos ? "#1f3fff" : "#bbb", size: 8 }, line: { color: r.fru_pos ? "#1f3fff" : "#ccc" }, name: `cluster ${r.cluster}`, hovertemplate: `cluster ${r.cluster}<br>%{y} DEGs<extra></extra>`, showlegend: false }));
    Plotly.react(pk1, tr1, lay({ xaxis: { type: "category", title: "stage (h APF)" }, yaxis: { title: "molecular distance" }, margin: { l: 55, r: 10, t: 10, b: 40 } }), PC);
    Plotly.react(pk2, tr2, lay({ xaxis: { type: "category", title: "stage (h APF)" }, yaxis: { title: "number of DEGs" }, margin: { l: 55, r: 10, t: 10, b: 40 } }), PC);
  };
  sk.onchange = drawK; drawK();
}

// ------------------------------------------------------------------ navigation
const FIGS = { 1: fig1, 2: fig2, 3: fig3, 4: fig4, 5: fig5 };
const built = {};
async function show(f) {
  [...$("nav").querySelectorAll("button")].forEach((b) => b.classList.toggle("on", b.dataset.f === String(f)));
  for (const k in built) built[k].hidden = k !== String(f);
  if (!built[f]) {
    const sec = document.createElement("div"); sec.innerHTML = `<h2>Figure ${f}</h2>`; $("main").appendChild(sec); built[f] = sec;
    try { await FIGS[f](sec); } catch (e) { console.error(e); div(sec, "err", "Failed to build this figure: " + e.message); }
    const fix = () => sec.querySelectorAll(".js-plotly-plot").forEach((el) => Plotly.Plots.resize(el));
    requestAnimationFrame(fix); setTimeout(fix, 400);
  }
  try { history.replaceState(null, "", "#fig" + f); } catch (e) { }
}
$("nav").onclick = (e) => { const f = e.target.dataset && e.target.dataset.f; if (f) show(f); };
boot().then(() => { $("boot").remove(); const m = location.hash.match(/fig(\d)/); show(m ? m[1] : "1"); })
  .catch((e) => { $("boot").innerHTML = `<span class="err">Failed to load: ${e.message}</span>`; });
</script>
