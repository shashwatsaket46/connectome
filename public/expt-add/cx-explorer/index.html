<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expression Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --panel: #ffffff; --ink: #1a1a1a; --ink-2: #4a4a4a; --ink-3: #808080;
  --rule: #e3e3e3; --accent: #2a78d6; --accent-ink: #fff; --sel: #eb6834; --zero: #d9d9d9;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
.wrap { padding: 12px 16px 24px; max-width: 1900px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 13px; }
.mono { font-family: var(--font-mono); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--rule); }
nav.tabs button { border: 1px solid transparent; border-bottom: none; background: none; padding: 7px 12px; font: inherit; color: var(--ink-2); cursor: pointer; border-radius: 6px 6px 0 0; }
nav.tabs button.on { background: var(--panel); border-color: var(--rule); color: var(--ink); font-weight: 600; margin-bottom: -1px; }
.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; }
.side { display: grid; gap: 10px; max-height: calc(100vh - 120px); overflow: auto; }
@media (max-width: 900px) { .side { max-height: none; } }
.side h3, .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); margin: 0 0 6px; font-weight: 600; }
label.row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 6px; margin: 4px 0; font-size: 13px; color: var(--ink-2); }
select, input[type=text], input[type=search], textarea { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 5px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
textarea { font-family: var(--font-mono); font-size: 12px; }
button.btn { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--rule); background: #fff; border-radius: 5px; cursor: pointer; color: var(--ink); }
button.btn.on, button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 4px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
.seg button { border: none; background: #fff; padding: 4px 9px; font: inherit; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: #fff; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 2px 6px; font-size: 12px; }
.legend .it { display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 1px 3px; border-radius: 4px; user-select: none; white-space: nowrap; overflow: hidden; }
.legend .it:hover { background: #f2f2f2; }
.legend .it.off { opacity: .35; text-decoration: line-through; }
.legend .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend .n { color: var(--ink-3); font-family: var(--font-mono); font-size: 10px; margin-left: auto; }
.hint { font-size: 12px; color: var(--ink-3); line-height: 1.4; }
.filters details { border-top: 1px solid var(--rule); padding: 4px 0; }
.filters summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
.filters summary .cnt { color: var(--sel); font-size: 11px; }
.plotwrap { user-select: none; -webkit-user-select: none; position: relative; height: calc(100vh - 150px); min-height: 520px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
#deckcanvas { position: absolute; inset: 0; }
#overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
#overlay.lasso { pointer-events: auto; cursor: crosshair; }
.ptitle { position: absolute; font-size: 12px; font-weight: 600; color: var(--ink-2); background: rgba(255,255,255,.85); padding: 1px 6px; border-radius: 4px; pointer-events: none; }
.vsep { position: absolute; border: 1px solid var(--rule); pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 5; max-width: 280px; }
.tip b { font-weight: 600; }
.cbar { position: absolute; right: 10px; bottom: 10px; background: rgba(255,255,255,.92); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; font-size: 11px; }
.cbar .bar { width: 160px; height: 10px; border-radius: 3px; }
.cbar .lab { display: flex; justify-content: space-between; font-family: var(--font-mono); }
.status { position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: var(--ink-3); background: rgba(255,255,255,.9); padding: 2px 6px; border-radius: 4px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--ink-2); }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th, table.t td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--rule); }
table.t th { color: var(--ink-3); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
table.t td.num { font-family: var(--font-mono); text-align: right; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: #f2f2f2; }
.pill { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 8px; background: #ececec; color: var(--ink-2); margin-left: 4px; }
.pill.pc { background: #d6e6f7; color: #1b4f8a; }
.chart { width: 100%; min-height: 480px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stat { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.stat .v { font-size: 20px; font-weight: 600; font-family: var(--font-mono); }
.stat .k { font-size: 12px; color: var(--ink-3); }
.selbox { border-left: 3px solid var(--sel); }
.err { color: #b3261e; font-size: 12px; }
.prose { max-width: 900px; line-height: 1.55; color: var(--ink-2); }
.prose h2 { font-size: 16px; color: var(--ink); margin: 18px 0 6px; }
.prose code { font-family: var(--font-mono); font-size: 12px; background: #f2f2f2; padding: 0 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1">Explorer</h1>
    <span class="sub" id="subtitle">loading…</span>
    <a class="sub" id="paperLink" href="paper.html" style="margin-left:auto;color:var(--accent)" hidden>Paper figures →</a>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="umap" class="on">UMAP</button>
    <button data-tab="comp">Composition</button>
    <button data-tab="dot">Dot plot / heatmap</button>
    <button data-tab="dev" id="devTabBtn">Across stages</button>
    <button data-tab="dist">Distributions</button>
    <button data-tab="markers">Markers</button>
    <button data-tab="about">About</button>
  </nav>

  <!-- ===================== UMAP TAB ===================== -->
  <section id="tab-umap" class="grid">
    <div class="side">
      <div class="card">
        <h3>Embedding</h3>
        <div class="seg" id="embSeg"></div>
        <h3 style="margin-top:12px">Colour by</h3>
        <div class="seg" id="modeSeg">
          <button data-m="ann" class="on">Annotation</button><button data-m="gene">Gene</button><button data-m="coexp">2 genes</button><button data-m="qc">QC</button>
        </div>
        <div id="modeAnn" style="margin-top:8px"><label class="row">annotation <select id="annSel"></select></label></div>
        <div id="modeGene" hidden style="margin-top:8px">
          <label class="row">gene <input type="search" id="geneIn" list="dlPercell" placeholder="gene"></label>
          <label class="row">clip at <select id="clipSel"><option value="100">max</option><option value="99" selected>99th pct</option><option value="95">95th pct</option><option value="90">90th pct</option></select></label>
          <div class="hint" id="geneMsg"></div>
        </div>
        <div id="modeCo" hidden style="margin-top:8px">
          <label class="row"><span style="color:#d62728">gene A</span> <input type="search" id="coA" list="dlPercell"></label>
          <label class="row"><span style="color:#1f9e3a">gene B</span> <input type="search" id="coB" list="dlPercell"></label>
          <div class="hint">Red = A only, green = B only, yellow = both.</div>
          <div class="hint" id="coMsg"></div>
        </div>
        <div id="modeQc" hidden style="margin-top:8px"><label class="row">metric <select id="qcSel"></select></label></div>
      </div>
      <div class="card">
        <h3>Layout</h3>
        <label class="row">split by <select id="splitSel"></select></label>
        <label class="row">point size <input type="range" id="sizeIn" min="0.3" max="6" step="0.1" value="1.4"></label>
        <label class="row">opacity <input type="range" id="opIn" min="0.1" max="1" step="0.05" value="0.85"></label>
        <label class="row">filtered cells <select id="hideSel"><option value="grey">show as grey</option><option value="hide">hide</option></select></label>
        <div class="btns" style="margin-top:6px">
          <button class="btn" id="lassoBtn" title="Draw a free-hand region to select cells">Lasso select</button>
          <button class="btn" id="resetViewBtn">Reset zoom</button>
          <button class="btn" id="pngBtn">PNG</button>
        </div>
      </div>
      <div class="card selbox" id="selCard" hidden>
        <h3>Selection</h3>
        <div id="selInfo"></div>
        <div class="btns" style="margin:6px 0">
          <button class="btn" id="selKeep">Keep only selection</button>
          <button class="btn" id="selClear">Clear</button>
        </div>
        <label class="row">breakdown <select id="selAnn"></select></label>
        <div id="selChart" style="height:220px"></div>
      </div>
      <div class="card filters">
        <h3>Legend &amp; filters</h3>
        <div class="hint" style="margin-bottom:6px">Click: hide/show · double-click: only this</div>
        <div id="legendMain"></div>
        <div id="filterList" style="margin-top:8px"></div>
        <div class="btns" style="margin-top:8px"><button class="btn" id="clearFilters">Clear all filters</button></div>
      </div>
    </div>
    <div class="plotwrap" id="plotwrap">
      <div id="deckcanvas"></div>
      <svg id="overlay"></svg>
      <div id="titles"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="cbar" id="cbar" hidden></div>
      <div class="status" id="status"></div>
      <div class="loading" id="loading">Loading…</div>
    </div>
  </section>

  <!-- ===================== COMPOSITION ===================== -->
  <section id="tab-comp" class="grid" hidden>
    <div class="side"><div class="card">
      <h3>Cross-tabulate</h3>
      <label class="row">bars (rows) <select id="compRow"></select></label>
      <label class="row">stack (colour) <select id="compCol"></select></label>
      <label class="row">show <select id="compNorm"><option value="count">cell counts</option><option value="row" selected>% within bar</option><option value="col">% within colour group</option></select></label>
      <label class="row">chart <select id="compKind"><option value="bar">stacked bars</option><option value="heat">heatmap</option></select></label>
      <label class="row">cells <select id="compScope"><option value="vis">current filter</option><option value="sel">lasso selection</option></select></label>
      
    </div></div>
    <div class="card"><div id="compChart" class="chart"></div></div>
  </section>

  <!-- ===================== DOT PLOT ===================== -->
  <section id="tab-dot" class="grid" hidden>
    <div class="side"><div class="card">
      <h3 id="dotH">Genes</h3>
      <textarea id="dotGenes" rows="6"></textarea>
      <div class="btns" style="margin-top:6px">
        <button class="btn" data-preset="markers">Top markers</button>
        <button class="btn" data-preset="nt">Transmitter</button>
        <button class="btn" data-preset="hox">Hox</button>
        <button class="btn" data-preset="ecd">Ecdysone</button>
        <button class="btn" data-preset="inter">Interactome</button>
      </div>
      <label class="row" style="margin-top:8px">groups <select id="dotGroup"></select></label>
      <label class="row">chart <select id="dotKind"><option value="dot">dot plot</option><option value="heat">heatmap (mean)</option><option value="heatf">heatmap (% expr.)</option></select></label>
      <label class="row">scale <select id="dotScale"><option value="gene">0–1 per gene</option><option value="raw">raw mean</option><option value="z">z-score per gene</option></select></label>
      <label class="row">order groups <select id="dotOrder"><option value="name">by name</option><option value="cluster">by similarity</option></select></label>
      <label class="row"><input type="checkbox" id="dotDropNA" checked style="width:auto"> <span>drop NA / Unclassified</span></label>
      <div class="btns"><button class="btn primary" id="dotGo">Plot</button></div>
      <div class="err" id="dotErr"></div>
      
    </div></div>
    <div class="card"><div id="dotChart" class="chart"></div></div>
  </section>

  <!-- ===================== ACROSS STAGES ===================== -->
  <section id="tab-dev" class="grid" hidden>
    <div class="side"><div class="card">
      <h3>Gene across <span id="devAxisName">stages</span></h3>
      <label class="row">gene <input type="search" id="devGene" list="dlAll"></label>
      <label class="row">metric <select id="devMetric"><option value="mean">mean</option><option value="frac">% cells expressing</option></select></label>
      <label class="row">split by <select id="devBy"></select></label>
      <label class="row">lines <select id="devTop"><option value="8">top 8 groups</option><option value="15">top 15</option><option value="all">all</option></select></label>
      <div class="btns"><button class="btn primary" id="devGo">Plot</button></div>
      <div class="err" id="devErr"></div>
      
    </div></div>
    <div style="display:grid; gap:12px">
      <div class="card"><div id="devLine" class="chart" style="min-height:380px"></div></div>
      <div class="card"><div id="devHeat" class="chart"></div></div>
    </div>
  </section>

  <!-- ===================== DISTRIBUTIONS ===================== -->
  <section id="tab-dist" class="grid" hidden>
    <div class="side"><div class="card">
      <h3>Per-cell distribution</h3>
      <label class="row">value <select id="distKind"></select></label>
      <label class="row">gene <input type="search" id="distGene" list="dlPercell"></label>
      <label class="row">groups <select id="distGroup"></select></label>
      <label class="row">cells <select id="distZero"><option value="nz">expressing only (&gt;0)</option><option value="all">all cells</option></select></label>
      <div class="btns"><button class="btn primary" id="distGo">Plot</button></div>
      <div class="err" id="distErr"></div>
      
    </div></div>
    <div class="card"><div id="distChart" class="chart"></div></div>
  </section>

  <!-- ===================== MARKERS ===================== -->
  <section id="tab-markers" class="grid" hidden>
    <div class="side"><div class="card">
      <h3>Marker genes</h3>
      <label class="row">grouping <select id="mkGrouping"></select></label>
      <label class="row">group <select id="mkGroup"></select></label>
      
      <div class="btns" style="margin-top:8px"><button class="btn" id="mkDot">Dot plot of top 3 per group</button></div>
    </div></div>
    <div class="card" style="max-height:calc(100vh - 150px); overflow:auto"><table class="t" id="mkTable"></table></div>
  </section>

  <!-- ===================== ABOUT ===================== -->
  <section id="tab-about" hidden>
    <div class="card"><div class="stats" id="aboutStats"></div></div>
    <div class="card" style="margin-top:12px"><div class="prose" id="aboutText"></div></div>
  </section>
</div>
<datalist id="dlPercell"></datalist>
<datalist id="dlAll"></datalist>

<script>
"use strict";
const DATA = "data/";
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("en-US");

// ---------------- palettes ----------------
const PAL = ["#1f77b4","#ff7f0e","#2ca02c","#d62728","#9467bd","#8c564b","#e377c2","#bcbd22","#17becf","#393b79",
  "#637939","#8c6d31","#843c39","#7b4173","#3182bd","#e6550d","#31a354","#756bb1","#6baed6","#fd8d3c",
  "#74c476","#9e9ac8","#e7ba52","#ad494a","#a55194","#5254a3","#8ca252","#bd9e39","#d6616b","#ce6dbd",
  "#3b6e8f","#b5cf6b","#ff9896","#c49c94","#f7b6d2","#4a1486","#00a087","#c51b7d","#7f7f7f","#005a32"];
const FIXED = {
  Stage: {"6":"#f2b134","24":"#e3693a","36":"#a8326e","48":"#3b2d7c"},
  neurotransmitter: {"Acetylcholine":"#2a78d6","GABA":"#e34948","Glutamate":"#1baf7a"},
  Sex: {"F":"#d6589f","M":"#2a78d6"},
  birthtime: {"primary":"#e3693a","earlysecondary":"#a8326e","secondary":"#2a78d6"},
  maturation: {"mature":"#2a78d6","precursor":"#eb6834"},
};
const NA_LIKE = new Set(["NA","Unclassified","noHemi","unknown"]);
const GREY = [215, 215, 215];
const VIR = ["#440154","#482878","#3e4989","#31688e","#26828e","#1f9e89","#35b779","#6ece58","#b5de2b","#fde725"];
const hex2rgb = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const VIR_RGB = VIR.map(hex2rgb);
const LUT = new Uint8Array(256*3);
for (let i = 0; i < 256; i++) {
  const t = i/255*(VIR.length-1), k = Math.min(Math.floor(t), VIR.length-2), f = t-k;
  for (let c = 0; c < 3; c++) LUT[i*3+c] = Math.round(VIR_RGB[k][c]*(1-f) + VIR_RGB[k+1][c]*f);
}
const PLOTLY_VIR = VIR.map((c,i) => [i/(VIR.length-1), c]);

// ---------------- state ----------------
let M, N, CELLS = {}, perm, C;
const PUPAL = { title: "Pupal VNC Explorer", unit: "neurons", primary: "hemilineage", paper: "paper.html",
  split: ["Stage", "neurotransmitter", "birthtime", "Sex", "maturation", "soma_neuromere"],
  hover: ["hemilineage", "Stage", "neurotransmitter", "soma_neuromere", "birthtime", "maturation", "Sex"],
  comp: ["hemilineage", "neurotransmitter"], dot_group: "hemilineage", dist_gene: "VGlut",
  dot_genes: "VGlut ChAT Gad1 unc-4 Lim3 tup exex ems Antp Ubx abd-A Abd-B", qc: ["nUMI", "nGene"], value_label: "log1p CP10k",
  dev: { tab: "Across stages", axis: "Stage", by: ["hemilineage", "neurotransmitter"], x_title: "hours APF", suffix: " h", default_gene: "Ets65A" },
  emb_labels: { umap: "UMAP (integrated)", UMAPallages: "UMAP all ages" } };
const geneIdx = new Map();      // per-cell gene -> file index
const allGeneIdx = new Map();   // any gene -> row in aggregates
const geneCache = new Map();
const aggCache = new Map();
const S = { emb: null, mode: "ann", ann: null, gene: null, coA: null, coB: null, qc: "nUMI",
  clip: 99, split: "none", size: 1.4, op: 0.85, hideMode: "grey", hidden: {}, selMask: null, selPoly: null,
  selView: null, keepSel: false, lasso: false };
let deckgl, viewState = null, views = [], layerIdx = {}, visible;

async function fetchBin(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " → HTTP " + r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  if (buf[0] === 0x1f && buf[1] === 0x8b) {
    const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(s).arrayBuffer();
  }
  return buf.buffer;
}
function colorsFor(key) {
  const cats = M.annotations[key], out = [];
  let j = 0;
  cats.forEach((c) => {
    if (FIXED[key] && FIXED[key][c]) out.push(FIXED[key][c]);
    else if (NA_LIKE.has(c)) out.push("#d0d0d0");
    else out.push(PAL[j++ % PAL.length]);
  });
  return out;
}

// ---------------- load ----------------
async function init() {
  M = await (await fetch(DATA + "manifest.json")).json();
  N = M.n_cells;
  C = Object.assign({}, M.config ? { qc: ["nUMI", "nGene"], value_label: "log1p CP10k", split: [], hover: [], emb_labels: {} } : PUPAL, M.config || {});
  S.emb = Object.keys(M.embeddings)[0]; S.ann = C.primary; S.split = C.default_split || "none"; S.qc = C.qc[0];
  document.title = C.title; $("h1").textContent = C.title;
  if (C.paper) { $("paperLink").href = C.paper; $("paperLink").hidden = false; }
  if (!C.dev) $("devTabBtn").hidden = true; else $("devTabBtn").textContent = C.dev.tab || `Across ${C.dev.axis}s`;
  $("dotGenes").value = C.dot_genes; $("distGene").value = C.dist_gene;
  const buf = await fetchBin(DATA + "cells.bin.gz");
  const TA = { float32: Float32Array, uint16: Uint16Array, uint8: Uint8Array };
  for (const [name, L] of Object.entries(M.layout)) CELLS[name] = new TA[L.dtype](buf, L.offset, L.length);
  M.genes_percell.forEach((g, i) => geneIdx.set(g, i));
  M.genes_all.forEach((g, i) => allGeneIdx.set(g, i));
  $("dlPercell").innerHTML = M.genes_percell.map((g) => `<option value="${g}">`).join("");
  $("dlAll").innerHTML = M.genes_all.map((g) => `<option value="${g}">`).join("");
  perm = new Uint32Array(N); for (let i = 0; i < N; i++) perm[i] = i;
  let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296;

  } else if (S.mode === "coexp" && S.coA && S.coB && geneCache.has(S.coA) && geneCache.has(S.coB)) {

  <p>Both embeddings were computed by the data's authors and stored in the loom file; nothing was re-embedded here.
  <b>UMAP (integrated)</b> is the loom's default embedding: cells from the four stages overlap, so the same neuron type at different ages lands in the same place.
  <b>UMAP all ages</b> (<code>UMAPallages</code>) keeps age differences: within each hemilineage island the stages lie in parallel bands, so you can see neurons mature.
  Use <i>split by → Stage</i> on the UMAP tab to compare stages side by side with a shared zoom.</p>
  <h2>Expression values</h2>
  <p>Counts are normalised per cell as <code>${M.normalization}</code>. Per-cell values are stored at 8-bit precision (256 levels per gene), which is plenty for colouring and violins.
  Per-cell values are included for ${fmt(M.genes_percell.length)} genes: the preMN/MN HVG list (${M.gene_sources.user_HVG_preMNs_MNs.length} genes found in this dataset), the Interactome v3 genes (${M.gene_sources.interactome_v3.length}),
  known neuronal identity genes, the top 10 markers of every hemilineage, transmitter, stage, neuromere, birthtime and maturation group, and the 1,000 most variable genes.
  For <b>all ${fmt(M.n_genes_total)} genes</b> the Dot plot, Across stages and Markers tabs use group summaries: mean log1p(CP10k) and the fraction of cells with a count above zero, per group (groups with fewer than 20 cells are dropped).</p>
  <h2>Ways to look at it</h2>
  <ul>
    <li><b>UMAP</b>: colour by any annotation, gene, a pair of genes (co-expression) or QC metric; click legend items to filter; split into small multiples; lasso a region to see what it contains.</li>
    <li><b>Composition</b>: how annotations relate, e.g. which transmitter each hemilineage uses, or how many cells of each hemilineage were sampled at each stage.</li>
    <li><b>Dot plot / heatmap</b>: any list of genes across hemilineages, transmitters, stages, or hemilineage × stage.</li>
    <li><b>Across stages</b>: how one gene changes from 6 to 48 h APF within each hemilineage.</li>
    <li><b>Distributions</b>: per-cell violins of a gene or of library size per group (useful for QC: compare nUMI across stages or samples).</li>
    <li><b>Markers</b>: the genes that best separate each group from the rest.</li>
  </ul>
  <h2>Caveats</h2>
  <ul>
    <li>Markers are a quick mean-difference ranking, not a statistical test; treat them as leads.</li>
    <li>${fmt(c.hemilineage[a.hemilineage.indexOf("Unclassified")] || 0)} cells have no hemilineage (“Unclassified”), and many primary neurons have no neuromere (“noHemi”).</li>
    <li>Group-level summaries ignore the UMAP filters; the Composition and Distributions tabs respect them.</li>
  </ul>`;
}

function buildAboutGeneric() {
  const c = M.annotation_counts, a = M.annotations;
  const stat = (v, k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  $("aboutStats").innerHTML = stat(fmt(N), C.unit) + stat(fmt(M.n_genes_total), "genes") +
    Object.keys(a).map((k) => stat(fmt(a[k].filter((x) => !NA_LIKE.has(x)).length), k)).join("") + stat(fmt(M.genes_percell.length), "genes per-cell");
  $("aboutText").innerHTML = `<p>${C.about || ""}</p><p>Values: ${C.value_label}. Per-cell values for ${fmt(M.genes_percell.length)} genes (UMAP, violins); group means for all genes (dot plot, markers).</p>`;
}
init().catch((e) => { $("loading").innerHTML = `<span class="err">Failed to load data: ${e.message}</span>`; console.error(e); });
</script>
</body>
